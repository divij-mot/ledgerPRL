[package]
name = "pearl-core"
version = "0.1.0"
description = "Bounded no_std Pearl hardware-wallet transaction policy and APDU core"
edition.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }
bech32 = { version = "=0.11.0", default-features = false }
zeroize = { version = "=1.8.1", default-features = false }

[dev-dependencies]
serde_json = "1.0"
proptest = "1.6"
hex = "0.4"
bitcoin = "0.32"
